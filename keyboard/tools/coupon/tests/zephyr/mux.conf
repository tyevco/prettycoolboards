# Zephyr v4.5.0's i2c_tca954x.c: BUILD_ASSERT(CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO > CONFIG_I2C_TCA954X_ROOT_INIT_PRIO),
# and both default to I2C_INIT_PRIORITY. Root after the I2C controller (50), channels after the root, both before
# the AT24 EEPROMs (CONFIG_EEPROM_AT2X_INIT_PRIORITY, default 80).
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=51
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=52
# the emulated I2C controller the mux sits on (native_sim only; not part of the finding)
CONFIG_EMUL=y
