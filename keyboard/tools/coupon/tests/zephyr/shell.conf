# The direct build plus Zephyr's eeprom shell on the dummy backend: tests/test_zephyr_app.py feeds it the lines
# make_eeprom.py --shell writes (Zephyr v4.5.0 drivers/eeprom/eeprom_shell.c, subsys/shell).
CONFIG_EMUL=y
CONFIG_EEPROM_AT2X_EMUL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_EEPROM_SHELL=y
