# The simulated board (native_sim): see sim/README in ../README.md. Not hardware.
CONFIG_BRINGUP_SIM=y
CONFIG_BRINGUP_USB=n
CONFIG_HWINFO=n
# kbd_testbed_a's Kconfig.defconfig sets these for the real board (the init order of SPEC §8.4)
CONFIG_GPIO_PCA95XX_INIT_PRIORITY=52
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=53
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=54
CONFIG_GPIO_PCA95XX_INTERRUPT=y
CONFIG_EMUL=y
CONFIG_SPI_EMUL=y
CONFIG_ADC_EMUL=y
CONFIG_GPIO_EMUL=y
CONFIG_I2C_EMUL=y
# Bench-supply mode is built in here, so host/test_sim.py can test it (the real board's default leaves it out)
CONFIG_BRINGUP_BENCH_SUPPLY=y
