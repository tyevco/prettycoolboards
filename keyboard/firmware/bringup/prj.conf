# bringup (Zephyr v4.5.0) for kbd_testbed_a. The board does not exist yet: compiled, never run.

# The board's buses and parts
CONFIG_GPIO=y
CONFIG_I2C=y
# Clock a stuck bus free at boot (main.c bus_check(); a warm reset mid-read can leave SDA held low, SPEC §5.2)
CONFIG_I2C_BUS_RECOVERY=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Shell on USART1 (the board's zephyr,shell-uart) and a second one on CDC ACM (src/cdc_shell.c)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=160
CONFIG_SHELL_ARGC_MAX=12
CONFIG_SHELL_PROMPT_UART="tb:uart> "
# Raw I2C access for the engineer at the bench (scan, read); it bypasses every rule of SPEC §8.4.
CONFIG_I2C_SHELL=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Logs to the shells (and the console)
CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_CBPRINTF_FP_SUPPORT=n
