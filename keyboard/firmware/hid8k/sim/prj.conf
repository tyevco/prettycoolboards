# hid8k-sim: added to ../prj.conf (the board's), see CMakeLists.txt.

CONFIG_HID8K_SIM=y

# Zephyr's USB host stack on the virtual host controller (devicetree: boards/).
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DRIVER=y
CONFIG_UHC_XFER_COUNT=32
CONFIG_UHC_BUF_COUNT=32
CONFIG_UHC_BUF_POOL_SIZE=8192
CONFIG_UVB_MAX_MESSAGES=64
CONFIG_USBH_STACK_SIZE=2048

# A 125 us timer needs a tick finer than native_sim's default 10 ms: one tick per microsecond,
# as Zephyr's own USB host test sets (tests/subsys/usb/host/Kconfig).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000000

# The simulation checks what the board build leaves unchecked.
CONFIG_ASSERT=y

# The button (gpio-keys on the emulated GPIO, boards/).
CONFIG_GPIO_EMUL=y

# Logs go to stdout, deferred as on the board (native_sim would default to immediate); keep the
# host stack quiet unless something is wrong.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USBH_LOG_LEVEL_WRN=y
CONFIG_UHC_DRIVER_LOG_LEVEL_WRN=y

# Run as fast as the host allows, not in real time (native_sim's default for a non-test app).
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
