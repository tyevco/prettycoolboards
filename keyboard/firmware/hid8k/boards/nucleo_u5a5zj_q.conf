# hid8k on the NUCLEO-U5A5ZJ-Q: added to prj.conf by Zephyr for this board only.

# The STM32 UDC driver's event queue (default 8), raised as a margin, not a measured need: an
# overrun drops a DataIn event (udc_stm32.c:759-772, "UDC Message queue overrun"), which would
# leave the HID endpoint waiting forever. See prj.conf for the stack's own queue.
CONFIG_UDC_STM32_MAX_QMESSAGES=32
