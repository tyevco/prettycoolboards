# hid8k: 8 kHz HID proof for the NUCLEO-U5A5ZJ-Q (Zephyr v4.5.0)

# The new USB device stack (device_next); high speed on usbotg_hs is its default on this board.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# HID: the IN pool needs one buffer more than the reports kept queued (CONFIG_HID8K_QUEUE_DEPTH),
# because usbd_hid calls input_report_done before it frees the completed buffer.
CONFIG_USBD_HID_IN_BUF_COUNT=4

# Event queue margins (defaults 8 and 10), not a measured need. At 8000 completions/s plus CDC
# traffic a short stall of the cooperative threads must not overrun them. An overrun of the
# STM32 UDC driver's queue loses a DataIn event (udc_stm32.c:759-772), which would leave the
# HID endpoint waiting forever; that one is set in boards/nucleo_u5a5zj_q.conf, so this file
# also builds for the native_sim simulation (sim/). The stack's own queue keeps transfer
# completions on a list (usbd_core.c:39-47), so an overrun there delays them but cannot lose
# one; it can still drop a bus event (reset, suspend), hence the margin.
CONFIG_USBD_MAX_UDC_MSG=32

# CDC ACM console (interrupt-driven UART API).
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# User button -> keyboard report.
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# Logs and printk go to the board console (USART1, the ST-LINK virtual COM port), not to the
# USB link under test.
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

CONFIG_MAIN_STACK_SIZE=2048
